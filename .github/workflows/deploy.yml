name: Build and deploy to Infomaniak

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Astro site
        run: npm run build

      - name: Deploy to staging (v2.stevecattin.com)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          port: 21
          protocol: ftps
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./dist/
          server-dir: ./
          dangerous-clean-slate: false

      - name: Deploy to production (stevecattin.com)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: lnja.ftp.infomaniak.com
          port: 21
          protocol: ftps
          username: lnja_production
          password: ${{ secrets.FTP_PASSWORD_PROD }}
          local-dir: ./dist/
          server-dir: ./
          dangerous-clean-slate: false